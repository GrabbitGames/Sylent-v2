<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We've Moved!</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        /* Container for the content */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 900px;
            gap: 20px;
        }

        /* Header */
        .title {
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 99, 71, 0.8);
            margin-bottom: 20px;
        }

        /* Box container for the two choices */
        .box-container {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
        }

        /* Individual boxes */
        .box {
            flex: 1;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            background: linear-gradient(135deg, #1e1e1e, #2b2b2b);
            box-shadow: 0 0 15px rgba(255, 99, 71, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 99, 71, 0.9);
        }

        /* Buttons */
        .box a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #ff6347;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 18px;
        }

        .box a:hover {
            background-color: #ff4433;
            transform: scale(1.1);
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .box-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">🚀 We've Moved! 🚀</div>

        <div class="box-container">
            <div class="box">
                <p>We moved to a new website!</p>
                <p>Click below to visit our new site:</p>
                <a href="https://proxyunb.netlify.app/" target="_blank">Go to New Site</a>
            </div>

            <div class="box">
                <p>Or continue playing on this website.</p>
                <p>We will go back to updating it soon.</p>
                <a href="games.html">Continue Playing</a>
            </div>
        </div>

        <div class="footer">Made by an Irmo Middle student</div>
    </div>

</body>
</html>
