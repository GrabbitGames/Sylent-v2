  <style>
    /* General reset and font settings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-image: url('full-main.png');
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ff6347;
      margin-bottom: 40px;
    }

    h6 {
      font-size: 1.2rem;
      color: #ff6347;
      margin-bottom: 40px;
    }

    /* Search Bar */
    .search-container {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
    }

    .search-container input {
      padding: 15px;
      font-size: 1.2rem;
      width: 100%;
      border-radius: 25px;
      border: 2px solid #444;
      outline: none;
      background-color: #333;
      color: #fff;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-container input:focus {
      border-color: #ff6347;
      box-shadow: 0 0 10px rgba(255, 99, 71, 0.5);
    }

    /* Category Filter */
    .category-filter {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .category-button {
      background-color: #444;
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background-color 0.3s ease;
    }

    .category-button:hover {
      background-color: #ff6347;
    }

    /* Glow Button */
    .glow-button {
      background: linear-gradient(45deg, #ff8c00, #ff4500);
      border: none;
      padding: 15px 40px;
      font-size: 1.5em;
      color: white;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0px 0px 20px rgba(255, 140, 0, 0.8), 0px 0px 40px rgba(255, 69, 0, 0.6);
      transform: perspective(500px) rotateX(10deg);
      transition: all 0.3s ease-in-out;
      width: 150px;
      height: 90px;
      margin: 20px 0;
    }

    .glow-button:hover {
      box-shadow: 0px 0px 40px rgba(255, 140, 0, 1), 0px 0px 80px rgba(255, 69, 0, 1);
      transform: perspective(500px) rotateX(0deg) scale(1.1);
    }

    /* Games Container */
    .games-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      width: 100%;
      max-width: 1200px;
    }

    .game {
      width: 200px;
      background-color: #2a2a2a;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
      padding: 20px;
      color: #fff;
      border: 1px solid #444;
      height: 250px;
      
    }

    .game:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-color: #333;
    }

    .game img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .game h3 {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ff6347;
      margin-bottom: 0px;
    }

    .game .category {
      font-size: 1rem;
      color: #bbb;
      margin-bottom: 10px;
    }

  </style>

games.forEach(game => {
  // Remove all dashes from the image path
  game.image = game.image.replace(/-/g, '');

  // Prepend /play.html?url= and encode the original link
  game.link = `/play.html?url=${encodeURIComponent(game.link)}`;
});

console.log(games);
    
    // Function to render the game cards
    function renderGames(games) {
      const container = document.querySelector(".games-container");
      container.innerHTML = '';

      games.forEach(game => {
        const gameElement = document.createElement("div");
        gameElement.classList.add("game");
        gameElement.innerHTML = `
          <img src="${game.image}" alt="${game.name}">
          <h3>${game.name}</h3>
          <div class="category">${game.categories.join(", ")}</div>
          <p>Click to play</p>
        `;
        gameElement.addEventListener("click", () => {
          window.location.href = game.link;
        });

        container.appendChild(gameElement);
      });
    }

    // Search function
    function searchGames() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filteredGames = games.filter(game => game.name.toLowerCase().includes(query));
      renderGames(filteredGames);
    }

    // Filter games by category
    function filterGamesByCategory(category) {
      const filteredGames = games.filter(game => game.categories.includes(category));
      renderGames(filteredGames);
    }

    // Initialize the page
    window.onload = () => {
      renderGames(games);
    }
  </script>

  <h1>I Made this junk</h1>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search for a game..." oninput="searchGames()" />
  </div>

  <!-- Category Filter -->
  <div class="category-filter">
    <button class="category-button" onclick="filterGamesByCategory('#Action')">Action</button>
    <button class="category-button" onclick="filterGamesByCategory('#Adventure')">Adventure</button>
    <button class="category-button" onclick="filterGamesByCategory('#Puzzle')">Puzzle</button>
    <button class="category-button" onclick="filterGamesByCategory('#Racing')">Racing</button>
    <button class="category-button" onclick="filterGamesByCategory('#Shooter')">Shooter</button>
    <button class="category-button" onclick="renderGames(games)">All Games</button>
  </div>

  <!-- Random Game Button -->
  <button class="glow-button" id="randomLinkButton">Random Game🎲</button>

  <!-- Games Container -->
  <div class="games-container"></div>
