<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Effect with Loading Message</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #loadingMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            opacity: 1;
            z-index: 10;
            display: flex;
            align-items: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #iframeContainer {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999;
        }
        #iframeContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="loadingMessage">
        Loading assets...
        <div class="spinner"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>
    <script>
        const { TweenMax, _ } = window;

        const randomInRange = (max, min) =>
            Math.floor(Math.random() * (max - min + 1)) + min;

        const ACTIVE_PROBABILITY = 0;
        const BASE_SIZE = 1;
        const VELOCITY_INC = 1.01;
        const VELOCITY_INIT_INC = 1.025;
        const JUMP_VELOCITY_INC = 1.25;
        const JUMP_SIZE_INC = 1.15;
        const SIZE_INC = 1.01;
        const RAD = Math.PI / 180;
        const WARP_COLORS = [
            [197, 239, 247],
            [25, 181, 254],
            [77, 5, 232],
            [165, 55, 253],
            [255, 255, 255],
        ];

        class Star {
            STATE = {
                alpha: Math.random(),
                angle: randomInRange(0, 360) * RAD,
            };
            reset = () => {
                const angle = randomInRange(0, 360) * (Math.PI / 180);
                const vX = Math.cos(angle);
                const vY = Math.sin(angle);
                const travelled =
                    Math.random() > 0.5
                        ? Math.random() * Math.max(window.innerWidth, window.innerHeight) + (Math.random() * (window.innerWidth * 0.24))
                        : Math.random() * (window.innerWidth * 0.25);
                this.STATE = {
                    ...this.STATE,
                    iX: undefined,
                    iY: undefined,
                    active: travelled ? true : false,
                    x: Math.floor(vX * travelled) + window.innerWidth / 2,
                    vX,
                    y: Math.floor(vY * travelled) + window.innerHeight / 2,
                    vY,
                    size: BASE_SIZE,
                };
            };
            constructor() {
                this.reset();
            }
        }

        const generateStarPool = size => new Array(size).fill().map(() => new Star());

        class JumpToHyperspace {
            STATE = {
                stars: generateStarPool(300),
                bgAlpha: 0,
                sizeInc: SIZE_INC,
                velocity: VELOCITY_INC,
                startTime: Date.now(), // To track elapsed time
            };
            canvas = document.createElement('canvas');
            context = this.canvas.getContext('2d');
            constructor() {
                this.bind();
                this.setup();
                document.body.appendChild(this.canvas);
                this.render();
            }
            render = () => {
                const { STATE: { bgAlpha, velocity, sizeInc, stars }, context } = this;
                context.clearRect(0, 0, window.innerWidth, window.innerHeight);
                if (bgAlpha > 0) {
                    context.fillStyle = `rgba(31, 58, 157, ${bgAlpha})`;
                    context.fillRect(0, 0, window.innerWidth, window.innerHeight);
                }
                const nonActive = stars.filter(s => !s.STATE.active);
                if (nonActive.length > 0) {
                    nonActive[0].STATE.active = true;
                }
                for (const star of stars.filter(s => s.STATE.active)) {
                    const { active, x, y, iX, iY, size, vX, vY } = star.STATE;
                    if (
                        ((iX || x) < 0 ||
                            (iX || x) > window.innerWidth ||
                            (iY || y) < 0 ||
                            (iY || y) > window.innerHeight) &&
                        active
                    ) {
                        star.reset(true);
                    } else if (active) {
                        const newX = x + vX;
                        const newY = y + vY;
                        star.STATE = {
                            ...star.STATE,
                            x: newX,
                            vX: star.STATE.vX * velocity,
                            y: newY,
                            vY: star.STATE.vY * velocity,
                            size: size * sizeInc,
                        };
                        let color = `rgba(255, 255, 255, ${star.STATE.alpha})`;
                        context.strokeStyle = color;
                        context.lineWidth = size;
                        context.beginPath();
                        context.moveTo(star.STATE.iX || x, star.STATE.iY || y);
                        context.lineTo(star.STATE.x, star.STATE.y);
                        context.stroke();
                    }
                }
                requestAnimationFrame(this.render);
                this.checkDuration(); // Check for 10 seconds duration
            };
            initiate = () => {
                if (this.STATE.jumping) return;
                this.STATE = {
                    ...this.STATE,
                    initiating: true,
                    initiateTimestamp: new Date().getTime(),
                };
                TweenMax.to(this.STATE, 0.25, { velocity: VELOCITY_INIT_INC, bgAlpha: 0.3 });
            };
            jump = () => {
                this.STATE = { ...this.STATE, bgAlpha: 0, jumping: true };
                TweenMax.to(this.STATE, 0.25, { velocity: JUMP_VELOCITY_INC, bgAlpha: 0.75, sizeInc: JUMP_SIZE_INC });
                setTimeout(() => {
                    this.STATE = { ...this.STATE, jumping: false };
                    TweenMax.to(this.STATE, 0.25, { bgAlpha: 0, velocity: VELOCITY_INC, sizeInc: SIZE_INC });
                }, 2500);
            };
            enter = () => {
                if (this.STATE.jumping) return;
                const { initiateTimestamp } = this.STATE;
                if (new Date().getTime() - initiateTimestamp > 600) {
                    this.jump();
                } else {
                    TweenMax.to(this.STATE, 0.25, { velocity: VELOCITY_INC, bgAlpha: 0 });
                }
            };
            bind = () => {
                this.canvas.addEventListener('mousedown', this.initiate);
                this.canvas.addEventListener('touchstart', this.initiate);
                this.canvas.addEventListener('mouseup', this.enter);
                this.canvas.addEventListener('touchend', this.enter);
            };
            setup = () => {
                this.context.lineCap = 'round';
                this.canvas.height = window.innerHeight;
                this.canvas.width = window.innerWidth;
            };
            reset = () => {
                this.STATE = { ...this.STATE, stars: generateStarPool(300) };
                this.setup();
            };
            checkDuration = () => {
                const currentTime = Date.now();
                if (currentTime - this.STATE.startTime >= 10000) { // 10 seconds duration
                    this.showIframe();
                }
            };
            showIframe = () => {
                // Hide hyperspace effect and loading message
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('iframeContainer').style.display = 'block';
                // Hide canvas
                this.canvas.style.display = 'none';
            };
        }

        window.myJump = new JumpToHyperspace();
        window.addEventListener('resize', _.debounce(() => window.myJump.reset(), 250));
    </script>

    <div id="iframeContainer">
        <iframe src="/static/embed.html#https://mathsspot.com" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

</body>
</html>
